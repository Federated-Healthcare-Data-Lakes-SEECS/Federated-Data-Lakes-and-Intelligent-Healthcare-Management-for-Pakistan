version: '3.8'

services:
  # Single Database Service
  postgres-db:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_DB: hospital_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    ports:
      - "5435:5432"
    volumes:
      - postgres_db_data:/var/lib/postgresql/data
    networks:
      - hospital_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Services
  hospital-backend:
    build:
      context: ./hospital-backend
      dockerfile: Dockerfile
    container_name: hospital-backend
    ports:
      - "3002:3002"
    environment:
      - DATABASE_URL=postgresql://postgres:123@postgres-db:5432/hospital_db
      - JWT_SECRET=your-jwt-secret-here
      - NODE_ENV=development
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - hospital_network
    volumes:
      - ./hospital-backend:/usr/src
      - /usr/src/node_modules
    restart: unless-stopped

  checkups-microservice:
    build:
      context: ./checkups-microservice
      dockerfile: Dockerfile
    container_name: checkups-microservice
    ports:
      - "3003:3003"
    environment:
      - DATABASE_URL=postgresql://postgres:123@postgres-db:5432/hospital_db
      - NODE_ENV=development
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - hospital_network
    volumes:
      - ./checkups-microservice:/usr/src
      - /usr/src/node_modules
    restart: unless-stopped

  # Frontend Services
  hospital-frontend:
    build:
      context: ./hospital-frontend
      dockerfile: Dockerfile
    container_name: hospital-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3002
    depends_on:
      - hospital-backend
    networks:
      - hospital_network
    volumes:
      - ./hospital-frontend:/app
      - /app/node_modules
    restart: unless-stopped

  admin-panel:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
    container_name: admin-panel
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3002
    depends_on:
      - hospital-backend
    networks:
      - hospital_network
    volumes:
      - ./admin-panel:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  postgres_db_data:

networks:
  hospital_network:
    driver: bridge